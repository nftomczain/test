name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    name: Lint + testy (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Zainstaluj zależności systemowe Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0

      - name: Zainstaluj zależności
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,dev]"

      - name: ruff (lint)
        run: ruff check .

      - name: black (format check)
        run: black --check .

      - name: pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  build:
    name: Budowa paczki (sdist + wheel)
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj build
        run: |
          python -m pip install --upgrade pip build

      - name: Zbuduj paczkę
        run: |
          python -m build

      - name: Wgraj artefakty
        uses: actions/upload-artifact@v4
        with:
          name: ghostposter-dist
          path: dist/*

  build-windows-portable:
    name: Budowa przenośnej wersji Windows (.exe)
    runs-on: windows-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj zależności
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,build]"

      - name: Zbuduj GhostPoster.exe (PyInstaller)
        run: pyinstaller ghostposter.spec --noconfirm

      - name: Spakuj do zip
        run: Compress-Archive -Path dist/GhostPoster -DestinationPath GhostPoster-windows-portable.zip

      - name: Wgraj artefakt
        uses: actions/upload-artifact@v4
        with:
          name: GhostPoster-windows-portable
          path: GhostPoster-windows-portable.zip

  build-linux-flatpak:
    name: Budowa Flatpak (Linux)
    runs-on: ubuntu-latest
    needs: lint-and-test

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.8
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Zbuduj Flatpaka
        uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: GhostPoster.flatpak
          manifest-path: flatpak/io.github.nftomczain.GhostPoster.yml
          cache-key: flatpak-builder-${{ github.sha }}

  build-linux-appimage:
    name: Budowa AppImage (Linux)
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj zależności systemowe (Qt headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0

      - name: Zainstaluj zależności Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,build]"

      - name: Zbuduj AppImage
        run: ./scripts/build_appimage.sh

      - name: Wgraj artefakt
        uses: actions/upload-artifact@v4
        with:
          name: GhostPoster-x86_64-AppImage
          path: GhostPoster-x86_64.AppImage
