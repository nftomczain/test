app-id: io.github.nftomczain.GhostPoster

runtime: org.kde.Platform
runtime-version: "6.8"
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: "6.8"
command: ghostposter-gui

build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1
    - BASEAPP_DISABLE_NUMPY=1

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=home
  - --device=dri

cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  - pip-dependencies.yaml

  - name: ghostposter
    buildsystem: simple

    build-commands:
      - pip3 install --no-build-isolation --prefix=/app .
      - install -Dm644 flatpak/io.github.nftomczain.GhostPoster.desktop /app/share/applications/io.github.nftomczain.GhostPoster.desktop
      - install -Dm644 flatpak/io.github.nftomczain.GhostPoster.metainfo.xml /app/share/metainfo/io.github.nftomczain.GhostPoster.metainfo.xml

      - install -Dm644 docs/icon-16.png /app/share/icons/hicolor/16x16/apps/io.github.nftomczain.GhostPoster.png
      - install -Dm644 docs/icon-24.png /app/share/icons/hicolor/24x24/apps/io.github.nftomczain.GhostPoster.png
      - install -Dm644 docs/icon-32.png /app/share/icons/hicolor/32x32/apps/io.github.nftomczain.GhostPoster.png
      - install -Dm644 docs/icon-48.png /app/share/icons/hicolor/48x48/apps/io.github.nftomczain.GhostPoster.png
      - install -Dm644 docs/icon-64.png /app/share/icons/hicolor/64x64/apps/io.github.nftomczain.GhostPoster.png
      - install -Dm644 docs/icon-96.png /app/share/icons/hicolor/96x96/apps/io.github.nftomczain.GhostPoster.png
      - install -Dm644 docs/icon-128.png /app/share/icons/hicolor/128x128/apps/io.github.nftomczain.GhostPoster.png
      - install -Dm644 docs/icon-256.png /app/share/icons/hicolor/256x256/apps/io.github.nftomczain.GhostPoster.png
      - install -Dm644 docs/icon-512.png /app/share/icons/hicolor/512x512/apps/io.github.nftomczain.GhostPoster.png

    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - build
          - dist
          - AppDir
          - "*.AppImage"
          - .pytest_cache
          - "**/__pycache__"
